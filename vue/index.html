<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/kso.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://use.fontawesome.com/releases/v6.4.2/css/all.css" rel="stylesheet">

    <title>KSO</title>

    <!-- The page before the app is loaded: KSO's mark with a ring turning around it, on the
         app's own background - dark when the app will be dark, decided here before anything
         is drawn, as useAppTheme decides it. It fades in after a moment, so a quick reload
         does not flash it. -->
    <script>
        (function () {
            var mode = null;
            try { mode = localStorage.getItem('kso.theme.mode'); } catch (e) {}
            var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('kso-dark');
        })();
    </script>
    <style>
        html, body { margin: 0; background: #ffffff; }
        html.kso-dark, html.kso-dark body { background: #0f1318; }

        #loading-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: loading-appear .3s ease-out .25s forwards;
        }

        #loading-content {
            position: relative;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #loading-content img {
            width: 48px;
            height: 48px;
        }

        #loading-content::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid rgba(38, 49, 60, .12);
            border-top-color: #2563eb;
            animation: loading-turn 1s linear infinite;
        }

        html.kso-dark #loading-content::before {
            border-color: rgba(232, 237, 242, .12);
            border-top-color: #7aa2ff;
        }

        @keyframes loading-turn {
            to { transform: rotate(360deg); }
        }

        @keyframes loading-appear {
            to { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            #loading-content::before { animation-duration: 3s; }
        }
    </style>
</head>
<body>
<div id="app">
    <div id="loading-wrapper" role="status" aria-label="Loading">
        <div id="loading-content">
            <img src="/kso.svg" alt="">
        </div>
    </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
