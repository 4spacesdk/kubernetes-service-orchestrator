services:

  deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GKE_AUTH_ENABLED: "${KSO_GKE_AUTH_ENABLED}"

    container_name: 4s-deploy-service-app
    restart: unless-stopped
    tty: true

    working_dir: /var/www/html

    ports:
      - "${KSO_CI4_PORT}:8080"

    environment:
      - ENVIRONMENT=development
      - BASE_URL=http://localhost:${KSO_CI4_PORT}
      - DB_HOST=${KSO_DB_HOST}
      - DB_NAME=${KSO_DB_NAME}
      - DB_USER=${KSO_DB_USER}
      - DB_PASS=${KSO_DB_PASS}
      - ENCRYPTION_KEY=${KSO_ENCRYPTION_KEY}
      - CRON_TOKEN=${KSO_CRON_TOKEN}
      - CENTRIFUGO_EXTERNAL_URL=ws://localhost:${KSO_CENTRIFUGO_PORT}/connection/websocket
      - CENTRIFUGO_API_URL=http://centrifugo:9000/api
      - CENTRIFUGO_HTTP_API_KEY=${KSO_CENTRIFUGO_API_KEY}
      - CERT_MANAGER_ISSUER_DEFAULT_NAME=${CONFIG_DEFAULTS_CERT_MANAGER_ISSUER_DEFAULT_NAME}
      - IMAGE_PULL_SECRET_DEFAULT_NAME=${CONFIG_DEFAULTS_IMAGE_PULL_SECRET_DEFAULT_NAME}
      - EMAIL_SERVICE_HOST=${CONFIG_EMAIL_HOST}
      - EMAIL_SERVICE_PORT=${CONFIG_EMAIL_PORT}
      - EMAIL_SERVICE_USER=${CONFIG_EMAIL_USER}
      - EMAIL_SERVICE_PASS=${CONFIG_EMAIL_PASS}
      - EMAIL_SERVICE_SENDER=${CONFIG_EMAIL_SENDER}

    volumes:
      - ./:/var/www/html:delegated

    networks:
      - deploy-service-network

  # Vite and npm. Built from the stage that builds the production Vue app, so the two use
  # the same Node. Idles until the npm scripts exec into it.
  vue:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: vue-toolchain

    container_name: 4s-deploy-service-vue
    restart: unless-stopped
    tty: true
    command: tail -f /dev/null

    working_dir: /vue

    ports:
      # vite listens on SERVER_PORT from vue/.env
      - "${KSO_VUE_PORT:-8951}:8901"

    volumes:
      - ./vue:/vue:delegated

    networks:
      - deploy-service-network

  # The push server. The same image and settings as the sidecar in the chart: browsers connect
  # on 8000 and may only subscribe; kso publishes on the internal port, which is not published.
  centrifugo:
    image: centrifugo/centrifugo:v6.9.6
    container_name: 4s-deploy-service-centrifugo
    restart: unless-stopped
    command: centrifugo

    ports:
      - "${KSO_CENTRIFUGO_PORT}:8000"

    environment:
      - CENTRIFUGO_CLIENT_TOKEN_JWKS_PUBLIC_ENDPOINT=http://deploy:8080/api/openidconfiguration/jwks
      - CENTRIFUGO_CLIENT_TOKEN_AUDIENCE=webclient
      - CENTRIFUGO_HTTP_API_KEY=${KSO_CENTRIFUGO_API_KEY}
      - CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=http://localhost:${KSO_VUE_PORT} http://localhost:${KSO_CI4_PORT}
      - CENTRIFUGO_HTTP_SERVER_INTERNAL_PORT=9000
      - CENTRIFUGO_HEALTH_ENABLED=true
      - CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_ALLOW_SUBSCRIBE_FOR_CLIENT=true
      - CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_SIZE=10
      - CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_HISTORY_TTL=300s
      - CENTRIFUGO_CHANNEL_WITHOUT_NAMESPACE_FORCE_RECOVERY=true

    networks:
      - deploy-service-network

  db:
    image: mysql:8.0
    container_name: 4s-deploy-service-db
    restart: unless-stopped
    tty: true
    ports:
      # Localhost only: the root password is `root`, and the rest of the network has no business
      # with it. kso reaches it over the compose network.
      - "127.0.0.1:${DATABASE_PORT}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf:delegated
      - ./docker/mysql/entrypoint-initdb.d:/docker-entrypoint-initdb.d/:delegated

    networks:
      - deploy-service-network

#  mssql:
#    build: ./docker/mssql
#    ports:
#      - "${DATABASE_MSSQL_PORT}:1433"
#    environment:
#      MSSQL_SA_PASSWORD: yTyQLXjH7uOXqwOowPK0@
#    networks:
#      - deploy-service-network

# Docker Networks
networks:
  deploy-service-network:
    driver: bridge

# Volumes
volumes:
  dbdata:
